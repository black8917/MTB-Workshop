<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1420" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Task Forge" />
  <meta name="description" content="An offline-first personal task dashboard." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./src/styles.css" />
  <title>Task Forge — My Dashboard</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"><span></span><span></span><span></span></span>
        <div><strong>TASK FORGE</strong><small>PERSONAL WORKSPACE</small></div>
      </div>
      <div class="nav-heading">WORKSPACE</div>
      <nav class="side-nav">
        <button class="nav-link selected" data-nav="dashboard"><span class="nav-icon" data-icon="layout"></span><span>Dashboard</span></button>
        <button class="nav-link" data-nav="tasks"><span class="nav-icon" data-icon="list"></span><span>All tasks</span><span class="nav-count" id="nav-open-count">0</span></button>
        <button class="nav-link" data-nav="inbox"><span class="nav-icon" data-icon="inbox"></span><span>Inbox</span><span class="nav-count" id="nav-inbox-count">0</span></button>
        <button class="nav-link" data-nav="projects"><span class="nav-icon" data-icon="grid"></span><span>Projects</span></button>
        <button class="nav-link" data-nav="archive"><span class="nav-icon" data-icon="archive"></span><span>Completed</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="storage-note"><span class="storage-dot"></span><div><b>Offline first</b><small>Stored on this device</small></div></div>
        <button class="nav-link" data-nav="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
      </div>
    </aside>
    <div class="main-column">
      <header class="topbar">
        <div class="topbar-left"><span class="mobile-brand">TF<span>.</span></span><span class="topbar-label">PERSONAL COMMAND CENTER</span></div>
        <div class="topbar-actions">
          <span class="sync-indicator"><span></span> LOCAL</span>
          <button class="btn btn-subtle topbar-settings" data-nav="settings" aria-label="Open settings"><span data-icon="settings"></span> Settings</button>
          <button class="btn btn-primary" data-action="new"><span data-icon="plus"></span><span>New task</span></button>
        </div>
      </header>
      <main class="main-content" id="main" tabindex="-1"></main>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <button class="bottom-link selected" data-nav="dashboard"><span data-icon="layout"></span><small>Home</small></button>
    <button class="bottom-link" data-nav="tasks"><span data-icon="list"></span><small>Tasks</small></button>
    <button class="bottom-link" data-nav="inbox"><span data-icon="inbox"></span><small>Inbox</small></button>
    <button class="bottom-link" data-nav="projects"><span data-icon="grid"></span><small>Projects</small></button>
    <button class="bottom-link" data-nav="settings"><span data-icon="settings"></span><small>Settings</small></button>
  </nav>
  <input id="import-file" type="file" accept=".json,application/json" hidden />
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
