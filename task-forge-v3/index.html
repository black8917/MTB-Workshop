function reviewPage(){const tasks=unreviewed(),suggestions=pendingSuggestions();return `${heading('APPROVAL INBOX','Review before anything changes',`${tasks.length} unverified imported tasks · ${suggestions.length} proposed actions`)}${demoLabel()}<div class="review-page-grid"><section class="panel"><div class="panel-heading"><div><span class="eyebrow">IMPORT TRIAGE</span><h2>Classify your OneNote tasks <span class="tiny-muted">${tasks.length}</span></h2></div></div><p class="inner-intro">Review each open item, assign its project, or mark it as outdated. Completion is never assumed.</p><div class="task-rows">${tasks.length?tasks.slice(0,50).map(t=>`<div class="review-task"><div><b>${esc(t.title)}</b><small>${esc(t.category)}</small></div><button class="btn btn-outline" data-action="task-edit" data-id="${esc(t.id)}">Review</button></div>`).join(''):`<div class="quiet-empty">Your imported tasks are all reviewed.</div>`}</div>${tasks.length>50?`<p class="light-note">Showing first 50 tasks. More are available from All tasks.</p>`:''}</section><section class="panel"><div class="panel-heading"><div><span class="eyebrow">OPTIONAL AI ASSISTANT</span><h2>Suggested actions</h2></div></div><p class="inner-intro">Demonstration proposals only. Live Gmail and Google Calendar integration is not connected, and no external actions are taken.</p><div class="v3-review-items">${suggestions.length?suggestions.map(reviewItem).join(''):`<div class="quiet-empty">No suggestions pending.</div>`}</div><p class="light-note">Approving a calendar proposal records your preference here, but does not create a real calendar event in this prototype.</p></section></div>`;}
const prefToggle=(key,name,desc)=>`<label class="setting-toggle"><span class="setting-toggle-copy"><b>${esc(name)}</b><small>${esc(desc)}</small></span><input type="checkbox" role="switch" data-pref="${key}" ${store.preferences[key]?'checked':''} /><span class="setting-switch"></span></label>`;
function settingsPage(){return `${heading('YOUR RULES','Settings','Choose what appears on your dashboard and protect your data.')}<div class="settings-grid"><section class="panel settings-panel settings-panel-wide"><div class="setting-header">${icon('layout',23)}<div><h2>Dashboard panels</h2><p>Hide cards without changing your tasks or history.</p></div></div><div class="setting-toggle-list">${prefToggle('showSummary','Overview counts','Open, completed, projects and review')}${prefToggle('showFocus','Focus tasks','Top priorities from across all projects')}${prefToggle('showProjects','Project charts','Project completion percentages')}${prefToggle('showHabits','Daily activities','Today’s workouts and rides')}${prefToggle('showReview','Review queue','Imported tasks and agent suggestions')}${prefToggle('showEmail','Email module','Show / hide email agent panel')}${prefToggle('showPrivacy','Storage reminder','Display local-only data notice')}</div></section><section class="panel settings-panel"><div class="setting-header">${icon('grid',23)}<div><h2>Categories</h2><p>Add and hide your own groups.</p></div></div><div class="category-settings-list">${store.categories.map(c=>`<div class="category-setting"><span class="category-dot" style="background:${c.color}"></span><strong>${esc(c.name)}</strong><button class="small-text-button" data-action="category-visibility" data-name="${esc(c.name)}">${c.visible?'Visible':'Hidden'}</button><button class="icon-button" data-action="edit-category" data-name="${esc(c.name)}" aria-label="Edit ${esc(c.name)}">${icon('pencil',16)}</button></div>`).join('')}</div><div class="settings-actions"><button class="btn btn-outline" data-action="new-category">${icon('plus',16)} New category</button><button class="btn btn-outline" data-action="new-project">${icon('plus',16)} New project</button></div></section><section class="panel settings-panel"><div class="setting-header">${icon('settings',23)}<div><h2>Layout defaults</h2><p>Adjust the task list and starting page.</p></div></div><div class="setting-toggle-list">${prefToggle('compactRows','Compact task rows','Show more tasks on each screen')}</div><div class="setting-controls"><label>Focus tasks<select data-pref-select="focusCount">${[3,5,8,10].map(n=>`<option ${store.preferences.focusCount===n?'selected':''} value="${n}">${n} tasks</option>`).join('')}</select></label><label>Start page<select data-pref-select="defaultView">${['dashboard','tasks','projects','habits','review'].map(k=>`<option value="${k}" ${store.preferences.defaultView===k?'selected':''}>${k}</option>`).join('')}</select></label></div></section><section class="panel settings-panel settings-panel-wide"><div class="setting-header">${icon('download',23)}<div><h2>Backup & import</h2><p>Export tasks, category hierarchy, daily activity history and approvals.</p></div></div><div class="settings-actions"><button class="btn btn-primary" data-action="export">${icon('download',17)} Export JSON backup</button><button class="btn btn-outline" data-action="import">${icon('upload',17)} Import OneNote or Task Forge JSON</button></div><p class="settings-muted">Private files are read on your device. Supports v1, v2 and v3 JSON. Review before replacing or merging. This v3 prototype uses separate browser storage from v2.</p></section><section class="panel settings-panel"><div class="setting-header">${icon('info',23)}<div><h2>Integrations</h2><p>Preview only · Approval required by design</p></div></div><div class="integration-status"><b>Gmail</b><span>Not connected</span></div><div class="integration-status"><b>Google Calendar</b><span>Not connected</span></div><div class="integration-status"><b>Cloud sync</b><span>Not connected</span></div><p class="settings-muted">No background scanning or external actions. Future connections will require separate account authorization.</p></section><section class="panel settings-panel"><div class="setting-header">${icon('rotate',23)}<div><h2>Prototype controls</h2><p>Restore preview data without affecting v2.</p></div></div><button class="btn btn-outline" data-action="reset-prototype">Reset v3 sample data</button></section></div>`;}
function chrome(){const open=openTasks().length;$('#nav-open-count').textContent=open;$('#nav-inbox-count').textContent=unreviewed().length+pendingSuggestions().length;$$('[data-nav]').forEach(el=>{let selected=el.dataset.nav===view||(view==='project-detail'&&el.dataset.nav==='projects');el.classList.toggle('selected',selected);if(selected)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});}
let detailId='';
function render(){chrome();const output= view==='dashboard'?dashboard():view==='tasks'?listPage():view==='projects'?projectsPage():view==='project-detail'?projectDetail(detailId):view==='habits'?habitsPage():view==='review'?reviewPage():view==='settings'?settingsPage():dashboard();$('#main').innerHTML=output;hydrateIcons(document);}
function nav(name){view=name;filter='open';categoryFilter='all';projectFilter='all';search='';render();window.scrollTo(0,0);}
function updateTask(id,patch){const i=store.tasks.findIndex(t=>t.id===id);if(i<0)return;store.tasks[i]=normalizeTask({...store.tasks[i],...patch,updatedAt:new Date().toISOString()});persist();render();}
function taskToggle(id){const t=store.tasks.find(x=>x.id===id);if(!t)return;const completed=t.status!=='completed';updateTask(id,{status:completed?'completed':'open',completedAt:completed?new Date().toISOString():null,reviewed:true});}
function habitToggle(id,day=today()){if(!store.history[id])store.history[id]={};store.history[id][day]=!store.history[id][day];persist();render();}
function editor(markup,postRender){$('#modal-root').innerHTML=`<div class="modal-shade" data-action="modal-close"><div class="editor v3-editor" role="dialog" aria-modal="true">${markup}</div></div>`;hydrateIcons($('#modal-root'));postRender?.();}
const modalHeader=(title,subtitle)=>`<div class="editor-head"><div><span class="eyebrow">${esc(subtitle)}</span><h2>${esc(title)}</h2></div><button class="icon-button" data-action="modal-close" aria-label="Close">${icon('close',20)}</button></div>`;
const modalFooter=(label)=>`<div class="editor-actions"><button type="button" class="btn btn-subtle" data-action="modal-close">Cancel</button><button class="btn btn-primary" type="submit">${esc(label)}</button></div>`;
const catOptions=(selected)=>store.categories.map(c=>`<option ${c.name===selected?'selected':''} value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
const projectOptions=(category,id)=>`<option value="">No specific project</option>${store.projects.map(p=>`<option ${p.id===id?'selected':''} value="${esc(p.id)}">${esc(p.name)} · ${esc(p.category)}</option>`).join('')}`;
function taskEditor(id=null,projectId=null){const existing=id?store.tasks.find(t=>t.id===id):null,project=projectById(projectId),t=existing||{title:'',category:project?.category||'Inbox',projectId:projectId||null,priority:'normal',reviewed:true,status:'open',notes:'',dueDate:''};editor(`${modalHeader(existing?'Review / edit task':'New task','PROJECT TASK')}<form id="task-form"><div class="form-body"><label>Task name<input name="title" required maxlength="260" value="${esc(t.title)}" placeholder="What needs doing?" /></label><div class="form-pair"><label>Category<select name="category">${catOptions(t.category)}</select></label><label>Priority<select name="priority">${['low','normal','high','urgent'].map(k=>`<option ${k===t.priority?'selected':''} value="${k}">${k}</option>`).join('')}</select></label></div><label>Project<select name="projectId">${projectOptions(t.category,t.projectId)}</select></label><div class="form-pair"><label>Due date<input type="date" name="dueDate" value="${esc(t.dueDate||'')}" /></label><label>Status<select name="status"><option value="open" ${t.status==='open'?'selected':''}>Open</option><option value="completed" ${t.status==='completed'?'selected':''}>Completed</option></select></label></div><label>Notes<textarea name="notes" rows="4">${esc(t.notes||'')}</textarea></label><label class="form-checkbox"><input type="checkbox" name="reviewed" ${t.reviewed?'checked':''} /> Reviewed and still relevant</label>${t.source==='OneNote PDF'?`<p class="source-detail">Imported from OneNote · source item ${t.sourceIndex||'unknown'}</p>`:''}</div>${modalFooter(existing?'Save task':'Add task')}</form>`,()=>{const f=$('#task-form');f.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(f),title=String(fd.get('title')||'').trim();if(!title)return;const p=projectById(fd.get('projectId')),nowDone=fd.get('status')==='completed';const task=normalizeTask({...t,id:existing?.id||uid(),title,category:p?.category||fd.get('category'),projectId:fd.get('projectId')||null,priority:fd.get('priority'),status:fd.get('status'),reviewed:fd.has('reviewed'),dueDate:fd.get('dueDate')||null,notes:fd.get('notes'),source:existing?.source||'Manual',completedAt:nowDone?(existing?.completedAt||new Date().toISOString()):null});if(existing)store.tasks=store.tasks.map(x=>x.id===existing.id?task:x);else store.tasks.unshift(task);persist();closeEditor();render();toast('Task saved');});});}
function categoryEditor(name=null){const c=store.categories.find(x=>x.name===name)||{name:'',color:'#8eaeb5'};editor(`${modalHeader(name?'Edit category':'Add category','CUSTOM GROUP')}<form id="category-form"><div class="form-body"><label>Name<input name="name" maxlength="70" required value="${esc(c.name)}" placeholder="e.g. Email, Side Projects"/></label><label>Marker color<input name="color" type="color" value="${esc(c.color)}" /></label><p class="light-note">Categories organize projects. Hiding one only hides its dashboard cards; it never deletes tasks.</p></div>${modalFooter(name?'Save category':'Create category')}</form>`,()=>{$('#category-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),next=String(fd.get('name')||'').trim(),color=fd.get('color');if(!next)return;if(store.categories.some(x=>x.name.toLowerCase()===next.toLowerCase()&&x.name!==name)){toast('Category already exists',true);return;}if(name){const old=store.categories.find(x=>x.name===name);old.name=next;old.color=color;store.projects.filter(p=>p.category===name).forEach(p=>p.category=next);store.tasks.filter(t=>t.category===name).forEach(t=>t.category=next);}else store.categories.push(normalizeCategory({name:next,color,icon:'grid'}));persist();closeEditor();render();toast('Category saved');});});}
function projectEditor(id=null){const original=projectById(id),p=original||{name:'',category:store.categories[0]?.name||'Inbox'};editor(`${modalHeader(original?'Edit project':'Create project','PROJECT')}<form id="project-form"><div class="form-body"><label>Project name<input name="name" maxlength="90" required value="${esc(p.name)}" placeholder="e.g. Polaris Snowmobile" /></label><label>Category<select name="category">${catOptions(p.category)}</select></label><p class="light-note">Every project can have its own progress chart and an unlimited list of tasks.</p></div>${modalFooter(original?'Save project':'Create project')}</form>`,()=>{$('#project-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);const name=String(fd.get('name')||'').trim(),category=fd.get('category');if(!name)return;if(original){original.name=name;original.category=category;store.tasks.filter(t=>t.projectId===original.id).forEach(t=>t.category=category);}else store.projects.push(normalizeProject({name,category}));persist();closeEditor();render();toast('Project saved');});});}
function habitEditor(id=null){const h=store.habits.find(x=>x.id===id)||{name:'',target:5};editor(`${modalHeader(id?'Edit activity':'New activity','DAILY HISTORY')}<form id="habit-form"><div class="form-body"><label>Activity name<input name="name" maxlength="90" required value="${esc(h.name)}" placeholder="e.g. Workout" /></label><label>Target days per week<select name="target">${[1,2,3,4,5,6,7].map(n=>`<option ${n===h.target?'selected':''} value="${n}">${n} / week</option>`).join('')}</select></label><p class="light-note">Check-ins are stored by date and are included in your backups.</p></div>${modalFooter('Save routine')}</form>`,()=>{$('#habit-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim();if(!name)return;const o=normalizeHabit({...h,id:id||uid(),name,target:Number(fd.get('target'))});if(id)store.habits=store.habits.map(x=>x.id===id?o:x);else store.habits.push(o);persist();closeEditor();render();toast('Routine saved');});});}
function suggestEditor(id){const s=store.suggestions.find(x=>x.id===id);if(!s)return;editor(`${modalHeader('Review suggestion','SAMPLE ONLY · APPROVAL REQUIRED')}<form id="suggest-form"><div class="form-body"><p class="light-note">${esc(s.detail)}. This is not a live Gmail or Calendar suggestion.</p><label>Suggested action<input required maxlength="260" name="title" value="${esc(s.title)}" /></label><label>Category<select name="category">${catOptions(s.category)}</select></label><label>Project<select name="projectId">${projectOptions(s.category,s.projectId)}</select></label><p class="light-note">${s.type==='calendar'?'Approving will record a local decision only; it will NOT create an event on Google Calendar.':'Approving will create a new local task in the selected category.'}</p></div><div class="editor-actions"><button type="button" class="btn btn-subtle" data-action="modal-close">Cancel</button><button class="btn btn-primary" type="submit">${s.type==='calendar'?'Approve locally':'Approve & add task'}</button></div></form>`,()=>{$('#suggest-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target),title=String(fd.get('title')||'').trim(),p=projectById(fd.get('projectId'));if(!title)return;s.status='approved';if(s.type!=='calendar')store.tasks.unshift(normalizeTask({id:`suggested-${s.id}`,title,category:p?.category||fd.get('category'),projectId:p?.id||null,status:'open',reviewed:true,priority:s.priority,source:'Sample suggestion'}));persist();closeEditor();render();toast(s.type==='calendar'?'Approved locally; no calendar event created':'Approved. Task added locally.');});});}
function closeEditor(){$('#modal-root').innerHTML='';pendingImport=null;}
function importJSON(file){if(!file)return;if(file.size>10*1024*1024){toast('10 MB import limit',true);return;}file.text().then(raw=>{const parsed=JSON.parse(raw);if(![1,2,3].includes(parsed.schemaVersion)||!Array.isArray(parsed.tasks))throw Error('Unsupported JSON task format');if(parsed.tasks.length>20000)throw Error('Too many tasks');const seen=new Set();const tasks=parsed.tasks.map(normalizeTask).filter(t=>{if(seen.has(t.id))return false;seen.add(t.id);return true;});pendingImport={parsed,tasks};editor(`${modalHeader('Import preview','REVIEW BEFORE APPLYING')}<div class="form-body"><p><b>${esc(file.name)}</b></p><div class="settings-stats"><div><b>${tasks.length}</b><small>Tasks</small></div><div><b>${tasks.filter(t=>t.status==='open').length}</b><small>Open</small></div><div><b>${tasks.filter(t=>t.status==='completed').length}</b><small>Done</small></div></div><p class="light-note">Merge adds missing task IDs and retains v3 categories, routines, activity history and review queue. Replace restores all v3 backup fields if present; v1/v2 imports retain the current category/routine framework.</p><div class="settings-actions"><button type="button" class="btn btn-primary" data-action="import-confirm" data-mode="merge">Merge tasks</button><button type="button" class="btn btn-outline" data-action="import-confirm" data-mode="replace">Replace tasks</button></div><p class="light-note">Export a backup before replacing anything important.</p></div>`);}).catch(e=>toast(`Import failed: ${e.message}`,true));}
function commitImport(mode){if(!pendingImport)return;const {parsed,tasks}=pendingImport;if(mode==='replace'){const next={...store,source:String(parsed.source||'Imported file'),tasks,importedAt:new Date().toISOString()};if(parsed.schemaVersion===3){next.categories=(parsed.categories||CATEGORIES).map(normalizeCategory);next.projects=(parsed.projects||PROJECTS).map(normalizeProject);next.habits=(parsed.habits||DEMO_HABITS).map(normalizeHabit);next.history=parsed.history||{};next.suggestions=(parsed.suggestions||[]).map(normalizeSuggestion);next.preferences=normalizePrefs(parsed.preferences);}else if(store.source==='demo'){next.suggestions=[];next.history={};}store=next;}else{const ids=new Set(store.tasks.map(t=>t.id));const next=tasks.filter(t=>!ids.has(t.id));store.tasks=store.source==='demo'?tasks:[...store.tasks,...next];if(store.source==='demo'){store.source=String(parsed.source||'Imported file');store.suggestions=[];store.history={};}if(parsed.schemaVersion===3){const currentCats=new Set(store.categories.map(c=>c.name));(parsed.categories||[]).forEach(c=>{if(!currentCats.has(c.name))store.categories.push(normalizeCategory(c));});const currentProj=new Set(store.projects.map(p=>p.id));(parsed.projects||[]).forEach(p=>{if(!currentProj.has(p.id))store.projects.push(normalizeProject(p));});}}pendingImport=null;closeEditor();persist();nav('review');toast('Import complete. Review new tasks to categorize them.');}
function exportJSON(){const blob=new Blob([JSON.stringify({...store,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const name=`task-forge-v3-backup-${today()}.json`;if(typeof File==='function'&&typeof navigator.share==='function'&&typeof navigator.canShare==='function'){const file=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Task Forge backup'}).catch(e=>{if(e?.name!=='AbortError')fallbackDownload(blob,name);});return;}}fallbackDownload(blob,name);}
function fallbackDownload(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast('Backup exported to your device');}
function action(el){const cmd=el.dataset.action,id=el.dataset.id;
 if(cmd==='new-task')return taskEditor(null,el.dataset.project||null);
 if(cmd==='task-edit')return taskEditor(id);
 if(cmd==='task-toggle')return taskToggle(id);
 if(cmd==='new-project')return projectEditor();
 if(cmd==='edit-project')return projectEditor(id);
 if(cmd==='project-open'){detailId=id;view='project-detail';render();window.scrollTo(0,0);return;}
 if(cmd==='new-category')return categoryEditor();
 if(cmd==='edit-category')return categoryEditor(el.dataset.name);
 if(cmd==='category-visibility'){const c=store.categories.find(x=>x.name===el.dataset.name);if(c){c.visible=!c.visible;persist();render();}return;}
 if(cmd==='new-habit')return habitEditor();
 if(cmd==='edit-habit')return habitEditor(id);
 if(cmd==='habit-day')return habitToggle(id,el.dataset.day);
 if(cmd==='habit-toggle')return habitToggle(id);
 if(cmd==='task-filter'){filter=id;render();return;}
 if(cmd==='suggest-review')return suggestEditor(id);
 if(cmd==='suggest-dismiss'){const s=store.suggestions.find(x=>x.id===id);if(s){s.status='dismissed';persist();render();toast('Suggestion dismissed');}return;}
 if(cmd==='import'){ $('#import-file').click();return;}
 if(cmd==='import-confirm')return commitImport(el.dataset.mode);
 if(cmd==='export')return exportJSON();
 if(cmd==='more-tasks'){showLimit+=100;render();return;}
 if(cmd==='reset-prototype'){if(confirm('Reset the v3 prototype? This deletes ONLY v3 local data. Export a backup first.')){store=demoState();persist();nav('dashboard');}return;}
 if(cmd==='modal-close')return closeEditor();
}
document.addEventListener('click',evt=>{const b=evt.target.closest('[data-nav]');if(b){nav(b.dataset.nav);return;}const a=evt.target.closest('[data-action]');if(a){if(a.classList.contains('modal-shade')&&evt.target!==a)return;action(a);}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='import-file'){importJSON(el.files[0]);el.value='';}if(el.dataset.pref){store.preferences[el.dataset.pref]=el.checked;persist();render();}if(el.dataset.prefSelect){store.preferences[el.dataset.prefSelect]=el.dataset.prefSelect==='focusCount'?Number(el.value):el.value;persist();render();}if(el.id==='category-select'){categoryFilter=el.value;render();}if(el.id==='project-select'){projectFilter=el.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='task-search'){search=e.target.value;const cur=e.target.selectionStart;render();const el=$('#task-search');el.focus();try{el.setSelectionRange(cur,cur);}catch{}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();if(e.key==='Enter'&&e.target.matches('.task-body[role="button"]'))taskEditor(e.target.closest('[data-id]').dataset.id);});
render();


</script>
